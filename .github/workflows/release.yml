name: Build SubsCheck Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            zip: SubsCheck-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            zip: SubsCheck-linux-x64.zip
          - os: macos-latest
            rid: osx-arm64
            zip: SubsCheck-macos-arm64.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish self-contained
      run: |
        dotnet publish SubsCheck/SubsCheck.csproj \
          -c Release \
          -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -o publish

    - name: Create ZIP
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          powershell -Command "Compress-Archive -Path publish\\* -DestinationPath ${{ matrix.zip }}"
        else
          zip -r ${{ matrix.zip }} publish
        fi

    - name: Create GitHub Release
      if: matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload ZIP to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.zip }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
