name: Build SubsCheck Multi-Platform Release

on:
  push:
    tags:
      - 'v*'      # triggers on tags like v1.0, v1.2.3
  workflow_dispatch: # allows manual runs

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            rid: win-x64
            zip: SubsCheck-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            zip: SubsCheck-linux-x64.zip
          - os: macos-latest
            rid: osx-arm64
            zip: SubsCheck-macos-arm64.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish self-contained
      run: |
        dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish

    - name: Create ZIP
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          Compress-Archive -Path publish\* -DestinationPath ${{ matrix.zip }}
        else
          zip -r ${{ matrix.zip }} publish
        fi

    - name: Create GitHub Release (once per workflow)
      if: github.run_attempt == 1 && matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload ZIP to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.zip }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
