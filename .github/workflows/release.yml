name: Build SubsCheck Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            zip: SubsCheck-win-x64.zip
            shell: pwsh
          - os: ubuntu-latest
            rid: linux-x64
            zip: SubsCheck-linux-x64.zip
            shell: bash
          - os: macos-latest
            rid: osx-arm64
            zip: SubsCheck-macos-arm64.zip
            shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish self-contained
      shell: ${{ matrix.shell }}
      run: |
        dotnet publish SubsCheck/Program \
          -c Release \
          -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -o publish

    - name: Create ZIP (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Compress-Archive -Path publish\* -DestinationPath ${{ matrix.zip }}

    - name: Create ZIP (Linux/macOS)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        zip -r ${{ matrix.zip }} publish

    - name: Create GitHub Release (once)
      if: matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload ZIP to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.zip }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
